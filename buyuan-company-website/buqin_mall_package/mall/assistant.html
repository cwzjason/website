<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商品智能助手 - 埠勤商贸</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔍</text></svg>">
<style>
:root {
  --primary: #1e293b;
  --primary-light: #f1f5f9;
  --primary-hover: #0f172a;
  --bg: #f8fafc;
  --white: #ffffff;
  --text: #1e293b;
  --text-light: #94a3b8;
  --text-secondary: #64748b;
  --border: #e2e8f0;
  --shadow: 0 2px 12px rgba(0,0,0,0.06);
  --radius: 8px;
  --topbar-h: 60px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'PingFang SC', 'Microsoft YaHei', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

/* ========== 顶部导航 ========== */
.top-nav {
  background: var(--white);
  color: var(--text);
  height: var(--topbar-h);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 32px;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 1000;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  border-bottom: 1px solid var(--border);
}
.top-nav .logo {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 1px;
  text-decoration: none;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 8px;
}
.top-nav .logo span { font-size: 14px; font-weight: 400; opacity: 0.55; }
.top-nav .nav-links { display: flex; gap: 28px; list-style: none; align-items: center; }
.top-nav .nav-links a {
  color: var(--text-secondary);
  text-decoration: none;
  font-size: 14px;
  font-weight: 500;
  transition: color 0.2s;
  position: relative;
}
.top-nav .nav-links a:hover,
.top-nav .nav-links a.active { color: var(--text); }
.top-nav .nav-links a.active::after {
  content: '';
  position: absolute;
  bottom: -6px;
  left: 0;
  right: 0;
  height: 2px;
  background: var(--text);
  border-radius: 1px;
}

/* ========== 主内容区 ========== */
.main-content {
  padding-top: calc(var(--topbar-h) + 40px);
  max-width: 900px;
  margin: 0 auto;
  padding-left: 20px;
  padding-right: 20px;
  padding-bottom: 60px;
}

/* 头部标题 */
.page-header {
  text-align: center;
  margin-bottom: 32px;
}
.page-header .icon { font-size: 52px; margin-bottom: 12px; }
.page-header h1 {
  font-size: 28px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 8px;
}
.page-header .desc {
  font-size: 15px;
  color: var(--text-secondary);
  line-height: 1.6;
}
.page-header .desc-note {
  font-size: 13px;
  color: #92400e;
  background: #fef3c7;
  display: inline-block;
  padding: 6px 16px;
  border-radius: 20px;
  margin-top: 10px;
}

/* 搜索框 */
.search-box {
  background: var(--white);
  border-radius: 16px;
  padding: 28px 32px;
  box-shadow: var(--shadow);
  margin-bottom: 24px;
  position: relative;
}
.search-input-wrap {
  display: flex;
  gap: 12px;
}
.search-input-wrap input {
  flex: 1;
  padding: 14px 20px;
  border: 2px solid var(--border);
  border-radius: 12px;
  font-size: 16px;
  font-family: inherit;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.search-input-wrap input:focus {
  border-color: #94a3b8;
  box-shadow: 0 0 0 3px rgba(0,0,0,0.05);
}
.search-input-wrap input::placeholder { color: var(--text-light); }
.search-btn {
  padding: 14px 32px;
  background: var(--white);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 12px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.2s, transform 0.15s;
  white-space: nowrap;
}
.search-btn:hover {
  background: var(--primary-light);
  transform: translateY(-1px);
}
.search-btn:active { transform: translateY(0); }
.search-hint {
  margin-top: 10px;
  font-size: 13px;
  color: var(--text-light);
}

/* 自动补全 */
.suggestions {
  position: absolute;
  top: calc(100% - 4px);
  left: 32px;
  right: 32px;
  background: var(--white);
  border: 1px solid var(--border);
  border-top: none;
  border-radius: 0 0 12px 12px;
  max-height: 260px;
  overflow-y: auto;
  box-shadow: 0 8px 24px rgba(0,0,0,0.1);
  z-index: 100;
  display: none;
}
.suggestions.show { display: block; }
.suggestion-item {
  padding: 10px 20px;
  cursor: pointer;
  font-size: 14px;
  transition: background 0.15s;
  border-bottom: 1px solid #f0f0f0;
}
.suggestion-item:last-child { border-bottom: none; border-radius: 0 0 12px 12px; }
.suggestion-item:hover,
.suggestion-item.active {
  background: var(--primary-light);
  color: var(--text);
}

/* 快捷标签 */
.quick-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 14px;
}
.quick-tag {
  padding: 6px 14px;
  background: var(--primary-light);
  color: var(--text);
  border-radius: 20px;
  font-size: 13px;
  cursor: pointer;
  border: none;
  transition: background 0.2s;
  font-family: inherit;
}
.quick-tag:hover { background: #e2e8f0; }

/* ========== 标签切换 ========== */
.tab-nav {
  display: flex;
  gap: 0;
  margin-bottom: 20px;
  border-radius: 12px;
  overflow: hidden;
  border: 2px solid var(--border);
  background: var(--white);
}
.tab-btn {
  flex: 1;
  padding: 13px 24px;
  background: var(--white);
  border: none;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  color: var(--text-secondary);
  transition: all 0.2s;
}
.tab-btn:first-child { border-right: 2px solid var(--border); }
.tab-btn.active {
  background: #e2e8f0;
  color: var(--text);
}
.tab-btn:hover:not(.active) {
  background: var(--primary-light);
  color: var(--text);
}

/* 商标卡片 */
.trademark-card {
  background: var(--white);
  border-radius: 12px;
  box-shadow: var(--shadow);
  padding: 20px 24px;
  margin-bottom: 10px;
  transition: box-shadow 0.2s;
}
.trademark-card:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
.tm-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
  flex-wrap: wrap;
  gap: 8px;
}
.tm-brand {
  font-size: 20px;
  font-weight: 700;
  color: var(--text);
}
.tm-class-badge {
  padding: 4px 12px;
  background: #dcfce7;
  color: #166534;
  border-radius: 12px;
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
}
.tm-meta {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 8px 24px;
  margin-bottom: 12px;
  font-size: 13px;
  color: var(--text-secondary);
}
.tm-meta-item { display: flex; gap: 4px; }
.tm-meta-item .label { color: var(--text-light); flex-shrink: 0; }
.tm-meta-item .value { color: var(--text); font-weight: 500; }
.tm-remark {
  padding: 10px 14px;
  background: #fafafa;
  border-radius: 8px;
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.6;
}
.tm-remark strong { color: var(--text); }
.tm-remark .similar-group {
  margin-top: 6px;
  font-size: 12px;
  color: var(--text-light);
}

/* 商标统计信息 */
.tm-stats {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 20px;
}
.tm-stat-item {
  background: var(--white);
  border-radius: 10px;
  padding: 14px 20px;
  box-shadow: var(--shadow);
  text-align: center;
  flex: 1;
  min-width: 100px;
}
.tm-stat-item .stat-num {
  font-size: 24px;
  font-weight: 700;
  color: var(--text);
}
.tm-stat-item .stat-label {
  font-size: 12px;
  color: var(--text-light);
  margin-top: 2px;
}

/* 结果区域 */
.result-section { display: none; }
.result-section.show { display: block; }

.result-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.result-header .result-count {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
}
.result-header .result-count span {
  color: var(--text);
  font-size: 20px;
}

.result-card {
  background: var(--white);
  border-radius: 12px;
  box-shadow: var(--shadow);
  overflow: hidden;
  margin-bottom: 10px;
  transition: box-shadow 0.2s;
}
.result-card:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.1); }

/* 路径面包屑 */
.breadcrumb-row {
  display: flex;
  align-items: center;
  padding: 14px 20px;
  gap: 6px;
  font-size: 14px;
}
.breadcrumb-row .crumb {
  padding: 5px 12px;
  border-radius: 6px;
  font-weight: 500;
  white-space: nowrap;
}
.breadcrumb-row .crumb-l1 { background: #ede9fe; color: #5b21b6; }
.breadcrumb-row .crumb-l2 { background: #f1f5f9; color: #475569; }
.breadcrumb-row .crumb-l3 { background: #fef3c7; color: #92400e; font-weight: 700; }
.breadcrumb-row .arrow { color: var(--text-light); font-size: 12px; flex-shrink: 0; }

.full-path {
  padding: 10px 20px;
  font-size: 13px;
  color: var(--text-secondary);
  background: #fafafa;
  border-top: 1px solid #f0f0f0;
}
.full-path code {
  background: #f1f5f9;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 12px;
  color: var(--text);
}

/* 空状态 */
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-light);
  display: none;
}
.empty-state .empty-icon { font-size: 60px; margin-bottom: 14px; }
.empty-state h3 { font-size: 18px; color: var(--text-secondary); margin-bottom: 8px; }
.empty-state p { font-size: 14px; }

/* 响应式 */
@media (max-width: 768px) {
  .top-nav { padding: 0 16px; }
  .top-nav .nav-links { gap: 14px; }
  .top-nav .nav-links a { font-size: 13px; }
  .search-box { padding: 20px; }
  .search-input-wrap { flex-direction: column; }
  .suggestions { left: 0; right: 0; top: 100%; }
}
@media (max-width: 480px) {
  .page-header h1 { font-size: 22px; }
  .breadcrumb-row { flex-wrap: wrap; }
}
</style>

function highlightMatch(text, keyword) {
  const escaped = keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return text.replace(new RegExp(`(${escaped})`, 'gi'), '<strong style="color:#64748b">$1</strong>');
}

// ============ 状态 ============
let selectedIdx = -1;

// ============ 初始化 ============
document.addEventListener('DOMContentLoaded', () => {
  loadQuickTags();

  const input = document.getElementById('searchInput');
  input.addEventListener('input', onInput);
  input.addEventListener('keydown', onKey);
  input.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') { hideSuggestions(); doSearch(); }
  });
  document.getElementById('searchBtn').addEventListener('click', doSearch);

  document.addEventListener('click', (e) => {
    if (!document.getElementById('searchBox').contains(e.target)) hideSuggestions();
  });
});

// ============ 快捷标签 ============
function loadQuickTags() {
  const tags = ['电话机', '猪肉', '牛肉', '饮料', '米', '面', '水泵', '口罩'];
  const container = document.getElementById('quickTags');
  tags.forEach(tag => {
    const btn = document.createElement('button');
    btn.className = 'quick-tag';
    btn.textContent = tag;
    btn.addEventListener('click', () => {
      document.getElementById('searchInput').value = tag;
      doSearch();
    });
    container.appendChild(btn);
  });
}

// ============ 自动补全 ============
function onInput(e) {
  const val = e.target.value.trim();
  if (!val) { hideSuggestions(); return; }

  const matched = ALL_L3.filter(c => c.includes(val)).slice(0, 12);
  if (matched.length === 0) { hideSuggestions(); return; }

  const box = document.getElementById('suggestions');
  box.innerHTML = matched.map((c, i) =>
    `<div class="suggestion-item" data-value="${escapeHtml(c)}">${highlightMatch(c, val)}</div>`
  ).join('');
  box.classList.add('show');
  selectedIdx = -1;

  box.querySelectorAll('.suggestion-item').forEach(item => {
    item.addEventListener('mousedown', (e) => {
      e.preventDefault();
      document.getElementById('searchInput').value = item.getAttribute('data-value');
      hideSuggestions();
      doSearch();
    });
  });
}

function hideSuggestions() {
  document.getElementById('suggestions').classList.remove('show');
  selectedIdx = -1;
}

// ============ 键盘导航 ============
function onKey(e) {
  const box = document.getElementById('suggestions');
  if (!box.classList.contains('show')) return;
  const items = box.querySelectorAll('.suggestion-item');
  if (items.length === 0) return;

  if (e.key === 'ArrowDown') {
    e.preventDefault();
    selectedIdx = Math.min(selectedIdx + 1, items.length - 1);
    items.forEach((item, i) => item.classList.toggle('active', i === selectedIdx));
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    selectedIdx = Math.max(selectedIdx - 1, 0);
    items.forEach((item, i) => item.classList.toggle('active', i === selectedIdx));
  } else if (e.key === 'Enter' && selectedIdx >= 0) {
    e.preventDefault();
    document.getElementById('searchInput').value = items[selectedIdx].getAttribute('data-value');
    hideSuggestions();
    doSearch();
  }
}

// ============ 执行搜索（纯本地，无API） ============
function doSearch() {
  const keyword = document.getElementById('searchInput').value.trim();
  if (!keyword) return;

  hideSuggestions();

  const section = document.getElementById('resultSection');
  const emptyEl = document.getElementById('emptyState');
  section.classList.remove('show');
  emptyEl.style.display = 'none';

  // 从内嵌数据中搜索
  const results = CATEGORY_DATA.filter(r => r.l3.includes(keyword));

  if (results.length === 0) {
    emptyEl.style.display = 'block';
    document.getElementById('emptyTitle').textContent = '未找到匹配的三级类目';
    document.getElementById('emptyDesc').textContent = `「${keyword}」不在类目表中，试试其他关键词`;
    return;
  }

  document.getElementById('searchKeyword').textContent = keyword;
  document.getElementById('resultNum').textContent = results.length;

  const listEl = document.getElementById('resultList');
  listEl.innerHTML = results.map(r => `
    <div class="result-card">
      <div class="breadcrumb-row">
        <span class="crumb crumb-l1">${escapeHtml(r.l1)}</span>
        <span class="arrow">›</span>
        <span class="crumb crumb-l2">${escapeHtml(r.l2)}</span>
        <span class="arrow">›</span>
        <span class="crumb crumb-l3">${escapeHtml(r.l3)}</span>
      </div>
      <div class="full-path">
        完整类目路径：<code>${escapeHtml(r.l1)} > ${escapeHtml(r.l2)} > ${escapeHtml(r.l3)}</code>
      </div>
    </div>
  `).join('');

  section.classList.add('show');
}

// ============ 标签切换 ============
function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.style.display = 'none');

  if (tab === 'category') {
    document.querySelectorAll('.tab-btn')[0].classList.add('active');
    document.getElementById('tabCategory').style.display = 'block';
    document.getElementById('searchInput').focus();
  } else {
    document.querySelectorAll('.tab-btn')[1].classList.add('active');
    document.getElementById('tabTrademark').style.display = 'block';
    document.getElementById('tmSearchInput').focus();
    initTmView();
  }
}

// ============ 商标查询 ============
let tmViewInited = false;

function initTmView() {
  if (tmViewInited) return;
  tmViewInited = true;
  loadTmQuickTags();
  showAllTrademarks();
}

function loadTmQuickTags() {
  const container = document.getElementById('tmQuickTags');
  // remove existing tags except the label span
  while (container.children.length > 1) {
    container.removeChild(container.lastChild);
  }
  const brands = [...new Set(TRADEMARK_DATA.map(t => t.brand))];
  const tags = [...brands, '查看全部'];
  tags.forEach(tag => {
    const btn = document.createElement('button');
    btn.className = 'quick-tag';
    btn.textContent = tag;
    btn.addEventListener('click', () => {
      if (tag === '查看全部') {
        document.getElementById('tmSearchInput').value = '';
        showAllTrademarks();
      } else {
        document.getElementById('tmSearchInput').value = tag;
        doTmSearch();
      }
    });
    container.appendChild(btn);
  });
}

function doTmSearch() {
  const keyword = document.getElementById('tmSearchInput').value.trim().toLowerCase();
  let results;

  if (!keyword) {
    results = TRADEMARK_DATA;
  } else {
    const numKeyword = parseInt(keyword);
    results = TRADEMARK_DATA.filter(t => {
      if (!isNaN(numKeyword) && t.intl_class === numKeyword) return true;
      return t.brand.toLowerCase().includes(keyword) ||
             t.applicant.toLowerCase().includes(keyword) ||
             t.remark.toLowerCase().includes(keyword) ||
             t.reg_no.includes(keyword);
    });
  }

  showTmResults(results);
}

function showAllTrademarks() {
  document.getElementById('tmSearchInput').value = '';
  showTmResults(TRADEMARK_DATA);
}

function showTmResults(results) {
  const emptyEl = document.getElementById('tmEmptyState');
  const resultEl = document.getElementById('tmResultSection');

  if (results.length === 0) {
    emptyEl.style.display = 'block';
    resultEl.classList.remove('show');
    updateTmStats([]);
    return;
  }

  emptyEl.style.display = 'none';
  resultEl.classList.add('show');
  document.getElementById('tmResultNum').textContent = results.length;

  const listEl = document.getElementById('tmResultList');
  listEl.innerHTML = results.map(t => {
    let products = t.remark;
    let similarGroups = '';
    const parts = t.remark.split('；');
    const lastPart = parts[parts.length - 1].trim();
    if (/^[\d\/]+$/.test(lastPart)) {
      products = parts.slice(0, -1).join('；');
      similarGroups = lastPart;
    }
    return `
      <div class="trademark-card">
        <div class="tm-header">
          <span class="tm-brand">${escapeHtml(t.brand)}</span>
          <span class="tm-class-badge">第 ${t.intl_class} 类</span>
        </div>
        <div class="tm-meta">
          <div class="tm-meta-item"><span class="label">注册号：</span><span class="value">${escapeHtml(t.reg_no)}</span></div>
          <div class="tm-meta-item"><span class="label">申请日期：</span><span class="value">${escapeHtml(t.apply_date)}</span></div>
          <div class="tm-meta-item"><span class="label">申请人：</span><span class="value">${escapeHtml(t.applicant)}</span></div>
        </div>
        <div class="tm-remark">
          <strong>商品/服务内容：</strong>${escapeHtml(products)}${similarGroups ? '<br><span class="similar-group">类似群：' + escapeHtml(similarGroups) + '</span>' : ''}
        </div>
      </div>
    `;
  }).join('');

  updateTmStats(results);
}

function updateTmStats(results) {
  const brands = [...new Set(results.map(t => t.brand))];
  const classes = [...new Set(results.map(t => t.intl_class))];
  document.getElementById('tmStats').innerHTML = `
    <div class="tm-stat-item">
      <div class="stat-num">${results.length}</div>
      <div class="stat-label">注册商标总数</div>
    </div>
    <div class="tm-stat-item">
      <div class="stat-num">${brands.length}</div>
      <div class="stat-label">商标品牌</div>
    </div>
    <div class="tm-stat-item">
      <div class="stat-num">${classes.length}</div>
      <div class="stat-label">覆盖类别</div>
    </div>
  `;
}

// 商标搜索回车事件
document.addEventListener('DOMContentLoaded', () => {
  const tmInput = document.getElementById('tmSearchInput');
  if (tmInput) {
    tmInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') doTmSearch();
    });
  }
});

</script>
