<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>湖北埠勤商贸有限公司</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💎</text></svg>">
  <style>
    /* ========== 全局重置 ========== */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
      line-height: 1.6;
    }

    /* ========== 导航栏 ========== */
    .navbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 60px;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid #e5e5e7;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
      z-index: 1000;
    }
    .navbar-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }
    .plane-icon { width: 36px; height: 36px; flex-shrink: 0; }
    .logo-text {
      font-size: 18px;
      font-weight: 600;
      color: #1e3a8a;
      letter-spacing: 0.3px;
    }
    .nav-links {
      display: flex;
      list-style: none;
      gap: 32px;
      align-items: center;
    }
    .nav-links a {
      text-decoration: none;
      color: #333;
      font-size: 14px;
      font-weight: 400;
      transition: color 0.2s ease;
    }
    .nav-links a:hover { color: #1e3a8a; }
    .nav-links a.active { color: #1e3a8a; font-weight: 500; }
    .nav-user { font-size: 13px; color: #86868b; margin-left: 8px; }

    /* ========== 首屏 Hero ========== */
    .hero {
      min-height: 100vh;
      background: #f5f5f7;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 120px 40px 80px;
      text-align: center;
    }
    .hero h1 {
      font-size: 56px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 20px;
      color: #1d1d1f;
      line-height: 1.2;
    }
    .hero p {
      font-size: 24px;
      color: #86868b;
      margin-bottom: 40px;
      max-width: 600px;
    }
    .hero-btn {
      display: inline-block;
      background: #1e3a8a;
      color: #ffffff;
      padding: 14px 32px;
      border-radius: 980px;
      text-decoration: none;
      font-size: 17px;
      font-weight: 400;
      transition: background 0.2s ease;
    }
    .hero-btn:hover { background: #162d62; }

    /* ========== 底部版权 ========== */
    .footer {
      padding: 30px 40px;
      text-align: center;
      border-top: 1px solid #e5e5e7;
      background: #ffffff;
    }
    .footer p {
      font-size: 13px;
      color: #86868b;
    }

    /* ========== 响应式 ========== */
    @media (max-width: 768px) {
      .navbar { padding: 0 20px; }
      .nav-links { gap: 16px; }
      .nav-links a { font-size: 13px; }
      .hero h1 { font-size: 36px; }
      .hero p { font-size: 18px; }
    }
    @media (max-width: 480px) {
      .hero h1 { font-size: 28px; }
      .hero p { font-size: 16px; }
      .nav-links { gap: 10px; }
      .nav-links a { font-size: 12px; }
    }
  </style>
</head>
<body>

  <!-- 导航栏 -->
  <nav class="navbar">
    <a href="index.html" class="navbar-logo">
      <svg class="plane-icon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M24 4L8 36L20 30L24 44L28 30L40 36L24 4Z" fill="#1e3a8a"/>
        <path d="M24 4L8 36L20 30L24 26L28 30L40 36L24 4Z" fill="#3b82f6"/>
        <circle cx="24" cy="28" r="3" fill="#ffffff"/>
        <rect x="22" y="14" width="4" height="14" rx="2" fill="#1e3a8a"/>
      </svg>
      <span class="logo-text">埠勤商贸</span>
    </a>
    <ul class="nav-links">
      <li><a href="index.html" class="active">首页</a></li>
      <li><a href="about.html">关于我们</a></li>
      <li><a href="products.html">产品服务</a></li>
      <li><a href="schedule.html">日程管理</a></li>
      <li><a href="mall/index.html" target="_blank">埠勤商城</a></li>
      <li><a href="https://qcncdkprniip.feishu.cn/app/JH6eb0yXDaPbRwsW8fpcA6p3n0z?pageId=pgeakzNKwKtIs7TK" target="_blank">经营仪表盘</a></li>
      <span id="currentUser" class="nav-user"></span>
    </ul>
  </nav>

  <!-- 首屏 -->
  <section class="hero">
    <h1>连接商业机遇<br>创造卓越价值</h1>
    <p>湖北埠勤商贸有限公司 — 专业的政企供应链服务商</p>
    <a href="products.html" class="hero-btn">进入产品中心</a>
  </section>

  <!-- 底部版权 -->
  <footer class="footer">
    <p>&copy; 2026 湖北埠勤商贸有限公司 版权所有 | ICP备XXXXXXXX号</p>
  </footer>

  <script src="assets/js/main.js"></script>
</body>
</html>
