  } catch(e) {}
  return false;
};

/* AI 悬浮拖拽按钮 */
.ai-fab {
  position: fixed;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  border: none;
  cursor: grab;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
  z-index: 999; right: 20px; bottom: 80px;
  transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
  user-select: none;
  -webkit-user-select: none;
  touch-action: none;
}

.ai-fab:hover {
  transform: scale(1.1);
  box-shadow: 0 4px 14px rgba(102, 126, 234, 0.4);
}

.ai-fab:active {
  cursor: grabbing;
}

.ai-fab.dragging {
  cursor: grabbing;
  transform: scale(1.05);
  opacity: 0.8;
  transition: none;
}

.ai-fab-icon {
  font-size: 16px;
  line-height: 1;
  pointer-events: none;
}

    // 300ms 防抖推送当前表格到服务器（不再写 localStorage，所有数据以服务器为准）
    clearTimeout(pushTimer);
    pushTimer = setTimeout(function() {
      pushCurrentTable();
    }, 300);
  }

  // ---- 推送到服务器 ----
  function syncOneTable(tableName) {
    var rs = ALL_DATA[tableName].rows;
    var seen = {};
    for (var i = 0; i < rs.length; i++) {
      var bh = String(rs[i]['编号'] || '').trim();
      if (!bh) continue;
      if (seen[bh] !== undefined) {
        console.log('表格 ' + tableName + ' 编号 "' + bh + '" 重复，跳过同步');
        return;
      }
      seen[bh] = i;
    }
    var payload = JSON.stringify({ rows: rs });
    ALL_DATA[tableName]._hash = payload;
    fetch(SERVER_SYNC_URL + '/' + encodeURIComponent(tableName) + '/sync', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: payload
    }).then(function(r){
      if (!r.ok && r.status === 409) {
        return r.json().then(function(d){
          console.log(tableName + ' sync: ' + d.error);
          // 数据冲突，立即拉取最新数据覆盖本地
          setTimeout(function() { pullFromServer(); }, 100);
        });
      }
      _tableVersions[tableName] = (_tableVersions[tableName] || 0) + 1;
      console.log(tableName + ' synced (' + rs.length + ' rows)');
    }).catch(function(e) { console.log(tableName + ' sync failed:', e); });
  }

  function pushCurrentTable() {
    if (!currentTable) return;
    // 同步当前活跃表
    syncOneTable(currentTable);
  }

  function pushAllTables() {
    for (var name in ALL_DATA) {
      if (ALL_DATA[name]) syncOneTable(name);
    }
  }

  // ---- 从服务器拉取 ----
  function pullFromServer() {
    if (_syncing) return;  // 等上一次完成再说，别积压
    _syncing = true;
    fetch(SERVER_SYNC_URL + '/version')
      .then(function(r) { return r.json(); })
      .then(function(versions) {
        var changedTables = [];
        for (var t in versions) {
          if (!ALL_DATA[t]) continue;
          if (versions[t] !== (_tableVersions[t] || 0)) {
            changedTables.push(t);
            _tableVersions[t] = versions[t];
          }
        }
        if (changedTables.length === 0 && _syncedOnce) return;
        if (!_syncedOnce) _syncedOnce = true;
        return fetch(SERVER_SYNC_URL).then(function(r) { return r.json(); });
      })
      .then(function(serverData) {
        if (!serverData) return;
        var changed = false;
        for (var tableName in serverData) {
          if (!ALL_DATA[tableName]) continue;
          var svrRows = serverData[tableName].rows || [];
          var newHash = JSON.stringify(svrRows);
          if (ALL_DATA[tableName]._hash === newHash) continue;
          ALL_DATA[tableName]._hash = newHash;
          ALL_DATA[tableName].rows = svrRows;
          ALL_DATA[tableName].headers = serverData[tableName].headers || ALL_DATA[tableName].headers;
          ALL_DATA[tableName].row_count = svrRows.length;
          changed = true;
        }
        if (changed) {
          renderSidebar();
          // 任何表的数据变化都强制重新渲染当前表格（最稳妥）
          renderTable();
        }
      }).finally(function() { _syncing = false; })
      .catch(function(e) { _syncing = false; console.log('拉取数据失败:', e); });
  }

  // 强制从服务器拉取并刷新（无视版本号/hash缓存）
  function pullFreshData() {
    if (_syncing) return;
    _syncing = true;
    fetch(SERVER_SYNC_URL).then(function(r) { return r.json(); }).then(function(serverData) {
      if (!serverData) return;
      for (var tableName in serverData) {
        if (!ALL_DATA[tableName]) continue;
        var svrRows = serverData[tableName].rows || [];
        ALL_DATA[tableName].rows = svrRows;
        ALL_DATA[tableName].headers = serverData[tableName].headers || ALL_DATA[tableName].headers;
        ALL_DATA[tableName].row_count = svrRows.length;
        ALL_DATA[tableName]._hash = JSON.stringify(svrRows);
      }
      if (ALL_DATA[currentTable]) renderTable();
    }).finally(function() { _syncing = false; })
    .catch(function(e) { _syncing = false; console.log('pullFreshData failed:', e); });
  }

  // 定时从服务器拉取最新数据（每 2 秒）
  setInterval(function() { pullFromServer(); }, SYNC_INTERVAL);

  function getFiltered() {
    var d = rows().slice().map(function(r, i){ r._idx = i; return r; });
    if (searchTerm) {
      var t = searchTerm.toLowerCase(), hs = headers();
      d = d.filter(function(r){ return hs.some(function(c){ return (r[c]||'').toLowerCase().indexOf(t)!==-1; }); });
    }
    if (currentSort.col >= 0) {
      var cn = headers()[currentSort.col];
      d.sort(function(a,b){
        var va=a[cn]||'', vb=b[cn]||'';
        var na=parseFloat(va), nb=parseFloat(vb);
        if(!isNaN(na) && !isNaN(nb)) return currentSort.asc ? na-nb : nb-na;
        return currentSort.asc ? String(va).localeCompare(String(vb),'zh-CN') : String(vb).localeCompare(String(va),'zh-CN');
      });
    }
    return d;
  }

  // ===== Column Width Helper =====
  function getColWidthClass(colName) {
    var xwide = ['备注','物流信息','费用明细','发货地址','收货地址','开票内容'];
    var wide  = ['商品名称','供应商名称','收料单位','供货商名称','实际采购品牌','订购单位','开票单位'];
    var xs    = ['编号'];
    var narrow = ['订单编号','订单日期','订单金额','单品编码','数量','单位','单价（含税）','不含税单价','税率','含税单价','折扣率','服务费','服务费金额','开票金额','应收金额','实收金额','成本小计（含税）','毛利','税额','净收入','回款金额','回款日期','报销日期','报销人','审批人','下单人职务','下单人电话','收货人联系方式','客户分级','日期','支出','收入','银行余额','利润','业绩归属','联系人','联系电话'];
    if (xwide.indexOf(colName) !== -1) return 'col-xwide';
    if (wide.indexOf(colName) !== -1) return 'col-wide';
    if (xs.indexOf(colName) !== -1) return 'col-xs';
    if (narrow.indexOf(colName) !== -1) return 'col-narrow';
    return 'col-medium';
  }

  // ===== 日期格式化：6位数字 YYMMDD -> 可读日期 =====
  function formatDateYYMMDD(val) {
    if (!val || typeof val !== 'string') return val;
    // 匹配纯6位数字
    var m = val.match(/^(\d{2})(\d{2})(\d{2})$/);
    if (!m) return val;
    var yy = parseInt(m[1], 10);
    var year = 2000 + yy;
    var month = parseInt(m[2], 10);
    var day = parseInt(m[3], 10);
    // 基本合法性检查
    if (month < 1 || month > 12 || day < 1 || day > 31) return val;
    return year + '.' + month + '.' + day;
  }
  var normalizeDate = formatDateYYMMDD;

  // ===== Table Rendering =====
  function renderTable() {

    cbAll.indeterminate = dAll.length > 0 && dAll.some(function(r){ return selectedRows.has(r._idx); }) && !cbAll.checked;
    cbAll.checkAll = function(e){
      e.stopPropagation();
      if (cbAll.checked) {
        cbAll.indeterminate = false;
        dAll.forEach(function(r){ selectedRows.add(r._idx); });

    // 数据列
    hs.forEach(function(c, i){

    if (subtotalIdx >= 0) {

      var trFoot = document.createElement('tr');

  function autoFitColumn(cIdx) {

    function deleteSelected() {
    if (!selectedRows.size) { showToast('请先勾选要删除的行'); return; }
    if (!confirm('确定删除选中的 '+selectedRows.size+' 条记录？')) return;
    var arr = Array.from(selectedRows).sort(function(a,b){ return b-a; });
    var r = rows();
    var hdrs = headers();
    var hasBianhao = hdrs.indexOf('编号') !== -1;
    // 优先用id，其次用编号
    var ids = arr.map(function(i){ return r[i]['id']; }).filter(function(b){ return b !== undefined && b !== null; });
    var bianhaos = [];
    if (hasBianhao) {
      bianhaos = arr.map(function(i){ return r[i]['编号'] || ''; }).filter(function(b){ return b; });
    }
    if (ids.length === 0 && bianhaos.length === 0) { showToast('没有可删除的记录'); return; }
    showToast('正在删除...');
    // 有id时优先用batch-delete，否则fallback到编号删除
    var delUrl, delBody;
    if (ids.length > 0) {
      delUrl = '/api/tables/' + encodeURIComponent(currentTable) + '/batch-delete';
      delBody = JSON.stringify({ids: ids});
    } else {
      delUrl = SERVER_SYNC_URL + '/' + encodeURIComponent(currentTable) + '/rows/delete';
      delBody = JSON.stringify({bianhaos: bianhaos});
    }
    fetch(delUrl, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: delBody
    }).then(function(resp){
      if (!resp.ok) throw new Error('server error');
      return resp.json();
    }).then(function(result){
      var deleted = result.deleted || result.affectedRows || 0;
      arr.forEach(function(i){ r.splice(i,1); });
      selectedRows.clear();
      saveData(); renderTable();
      showToast('已删除 ' + deleted + ' 条');
    }).catch(function(err){
      showToast('删除失败: ' + err.message);
    });
  }

  function handleImportFile(e) {
    var file = e.target.files[0];
    if (!file) return;
    if (!file.name.match(/\.xlsx?$/i)) { showToast('请选择 .xlsx 或 .xls 文件'); return; }
    showToast('正在解析文件...');
    var formData = new FormData();
    formData.append('file', file);
    fetch('/api/tables/' + encodeURIComponent(currentTable) + '/import', {
      method: 'POST',
      body: formData
    })
    .then(function(r) { return r.json(); })
    .then(function(res) {
      if (res.success) {
        showToast('成功导入 ' + res.inserted + ' 条记录');
        // 用服务端返回的全量数据替换本地数据（编号已自动递增）
        if (res.rows) {
          var tbl = ALL_DATA[currentTable];
          tbl.rows = res.rows.map(function(r, i) {
            var nr = {};
            tbl.headers.forEach(function(h) { nr[h] = r[h] !== undefined ? r[h] : ''; });
            nr._idx = i;
            return nr;
          });
        }
        saveData(); renderTable(); renderSidebar();
      } else {
        showToast('导入失败: ' + (res.error || '未知错误'));
      }
    })
    .catch(function(err) { showToast('导入失败: ' + err.message); })
    .finally(function() { e.target.value = ''; });
  }

  function exportToExcel() {
    var hs = headers();
    var hadSelection = selectedRows.size > 0;
    var source = hadSelection
      ? getFiltered().filter(function(r){ return selectedRows.has(r._idx); })
      : getFiltered();
    if (!source.length) { showToast('没有数据可导出'); return; }
    var data = [hs];
    source.forEach(function(r){
      data.push(hs.map(function(c){ return r[c] || ''; }));
    });
    if (typeof XLSX === 'undefined') {
      showToast('Excel 库加载失败，正在用 CSV 导出...');
      var csv = '\uFEFF' + hs.join(',') + '\n';
      source.forEach(function(r){
        csv += hs.map(function(c){ return '"'+(r[c]||'').replace(/"/g,'""')+'"'; }).join(',') + '\n';
      });
      var blob = new Blob([csv],{type:'text/csv;charset=utf-8;'});
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = currentTable+'_'+new Date().toISOString().slice(0,10)+'.csv';
      a.click(); URL.revokeObjectURL(a.href);
      showToast('已导出 ' + source.length + ' 条记录为 CSV');
      if (hadSelection) {
        selectedRows.clear(); renderTable();
        var tb = document.getElementById('batchToolbar');
        if (tb) { tb.classList.remove('has-selection'); tb.style.display = 'none'; }
      }
      return;
    }
    var wb = XLSX.utils.book_new();
    var ws = XLSX.utils.aoa_to_sheet(data);
    XLSX.utils.book_append_sheet(wb, ws, currentTable);
    XLSX.writeFile(wb, currentTable + '_' + new Date().toISOString().slice(0,10) + '.xlsx');
    showToast('已导出 ' + source.length + ' 条记录为 Excel');
    if (hadSelection) {
      selectedRows.clear(); renderTable();
      var tb = document.getElementById('batchToolbar');
      if (tb) { tb.classList.remove('has-selection'); tb.style.display = 'none'; }
    }
  }

  function getSourceData(sourceName) {
    var tbl = ALL_DATA[sourceName];
    if (!tbl) return { headers: [], rows: [] };
    return { headers: tbl.headers, rows: tbl.rows };
  }

  function detectNumericCols(sourceName) {
    var info = getSourceData(sourceName);
    var nums = [];
    info.headers.forEach(function(h){
      var allNum = true, hasVal = false;
      info.rows.forEach(function(r){
        var v = r[h];
        if (v !== '' && v !== null && v !== undefined) {
          hasVal = true;
          if (isNaN(parseFloat(v)) || !isFinite(v)) allNum = false;
        }
      });
      if (hasVal && allNum) nums.push(h);
    });
    return nums;
  }

  function detectLabelCols(sourceName) {
    var info = getSourceData(sourceName);
    var labels = [];
    info.headers.forEach(function(h){
      var uniqueVals = {}, totalVals = 0;
      info.rows.forEach(function(r){
        var v = r[h];
        if (v !== '' && v !== null && v !== undefined) {
          totalVals++;
          uniqueVals[v] = true;
        }
      });
      var uniqueCount = Object.keys(uniqueVals).length;
      // Good label columns have reasonable uniqueness (not all unique, not all same)
      if (totalVals > 0 && uniqueCount >= 1 && uniqueCount <= 20 && uniqueCount === totalVals) {
        labels.push(h);
      } else if (totalVals > 0 && uniqueCount > 1 && uniqueCount <= 30) {
        labels.push(h);
      }
    });
    // Prioritize common label columns
    var priority = ['收料单位','供应商名称','商品名称','品牌','单位','分类','采购单编号'];
    labels.sort(function(a,b){
      var ai = priority.indexOf(a), bi = priority.indexOf(b);
      if (ai >= 0 && bi >= 0) return ai - bi;
      if (ai >= 0) return -1;
      if (bi >= 0) return 1;
      return 0;
    });
    return labels;
  }

  function updateColumnSelectors() {

  }

  function renderKPIs() {
    var sourceName = document.getElementById('dbDataSource').value;
    var info = getSourceData(sourceName);
    var numCols = detectNumericCols(sourceName);
    var kpiRow = document.getElementById('kpiRow');
    kpiRow.innerHTML = '';

    // Calculate KPIs
    var totalSum = 0, maxVal = -Infinity, minVal = Infinity, rowCount = info.rows.length;

    // Pick the best value column for KPIs
    var bestCol = '';
    var bestCols = ['合计（含税）','小计（含税）','利润','净收入','金额','数量','支出','收入','小计','费用'];
    for (var i = 0; i < bestCols.length; i++) {
      if (numCols.indexOf(bestCols[i]) >= 0) { bestCol = bestCols[i]; break; }
    }
    if (!bestCol && numCols.length > 0) bestCol = numCols[0];

    info.rows.forEach(function(r){
      var v = parseFloat(r[bestCol]);
      if (!isNaN(v)) {
        totalSum += v;
        if (v > maxVal) maxVal = v;
        if (v < minVal) minVal = v;
      }
    });

    var avgVal = rowCount > 0 ? totalSum / rowCount : 0;

    var kpis = [
      { icon:'💰', label:'总和('+bestCol+')', value: totalSum.toLocaleString('zh-CN', {minimumFractionDigits:2,maximumFractionDigits:2}), sub: info.rows.length + ' 条数据', color:'#eef2ff', iconBg:'#6366f1' },
      { icon:'📊', label:'平均值', value: avgVal.toLocaleString('zh-CN', {minimumFractionDigits:2,maximumFractionDigits:2}), sub: '每行平均', color:'#ecfdf5', iconBg:'#22c55e' },
      { icon:'🔝', label:'最大值', value: (maxVal === -Infinity ? 0 : maxVal).toLocaleString('zh-CN', {minimumFractionDigits:2,maximumFractionDigits:2}), sub: '单笔最高', color:'#fffbeb', iconBg:'#f59e0b' },
      { icon:'📉', label:'最小值', value: (minVal === Infinity ? 0 : minVal).toLocaleString('zh-CN', {minimumFractionDigits:2,maximumFractionDigits:2}), sub: '单笔最低', color:'#fef2f2', iconBg:'#ef4444' }
    ];

    kpis.forEach(function(kpi){
      kpiRow.innerHTML += ''+
        '<div class="db-kpi-card" style="background:'+kpi.color+'">'+
          '<div class="db-kpi-icon" style="background:'+kpi.iconBg+'20;color:'+kpi.iconBg+'">'+kpi.icon+'</div>'+
          '<div class="db-kpi-info">'+
            '<div class="db-kpi-label">'+kpi.label+'</div>'+
            '<div class="db-kpi-value">'+kpi.value+'</div>'+
            '<div class="db-kpi-sub">'+kpi.sub+'</div>'+
          '</div>'+
        '</div>';
    });
  }

  function getTypeName(type) {
    var map = {
      'bar':'柱状图','horizontalBar':'横向柱状图','line':'折线图',
      'pie':'饼图','doughnut':'环形图','radar':'雷达图',
      'polarArea':'极地图','scatter':'散点图'
    };
    return map[type] || type;
  }

  // Colors
  var PALETTE = [
    '#6366f1','#22c55e','#f59e0b','#ef4444','#8b5cf6',
    '#06b6d4','#ec4899','#14b8a6','#f97316','#3b82f6',
    '#84cc16','#e11d48','#a855f7','#0ea5e9','#10b981'
  ];

  function renderChart(config) {
    var canvas = document.getElementById(config.id);
    if (!canvas) return;

    // Destroy previous instance
    if (chartInstances[config.id]) {
      chartInstances[config.id].destroy();
    }

    var info = getSourceData(config.source);
    var labels = [];
    var dataValues = [];

    // Aggregate data by label column
    var aggregated = {};
    info.rows.forEach(function(r){
      var label = r[config.labelCol] || '(空)';
      var val = parseFloat(r[config.valueCol]);
      if (isNaN(val)) val = 0;
      if (!aggregated[label]) aggregated[label] = 0;
      aggregated[label] += val;
    });

    labels = Object.keys(aggregated);
    dataValues = labels.map(function(l){ return aggregated[l]; });

    if (labels.length === 0) return;

    var ctx = canvas.getContext('2d');
    var chartType = config.chartType;

    // Chart.js doesn't have horizontalBar as a separate type in v4 - it's bar with indexAxis:'y'
    var isHorizontal = (chartType === 'horizontalBar');
    var actualType = isHorizontal ? 'bar' : chartType;

    // For pie/doughnut/polarArea, use single dataset
    // For bar/line/radar, use single dataset
    var datasets = [{
      label: config.valueCol,
      data: dataValues,
      backgroundColor: labels.map(function(_, i){ return PALETTE[i % PALETTE.length] + '99'; }),
      borderColor: labels.map(function(_, i){ return PALETTE[i % PALETTE.length]; }),
      borderWidth: 1,
      borderRadius: actualType === 'bar' ? 6 : undefined,
    }];

    if (actualType === 'scatter') {
      datasets = [{
        label: config.valueCol,
        data: labels.map(function(l, i){ return { x: i, y: dataValues[i] }; }),
        backgroundColor: PALETTE[0] + '99',
        borderColor: PALETTE[0],
        pointRadius: 5,
        pointHoverRadius: 8,
      }];
    }

    try {
      chartInstances[config.id] = new Chart(ctx, {
        type: actualType,
        data: { labels: labels, datasets: datasets },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          indexAxis: isHorizontal ? 'y' : 'x',
          plugins: {
            legend: {
              display: actualType !== 'pie' && actualType !== 'doughnut' && actualType !== 'polarArea',
              position: 'top',
              labels: { font: { size: 12 }, usePointStyle: true, padding: 16 }
            },
            tooltip: {
              callbacks: {
                label: function(ctx){
                  var val = ctx.raw;
                  if (typeof val === 'object' && val !== null) val = val.y;
                  return ctx.label + ': ' + (typeof val === 'number' ? val.toLocaleString('zh-CN') : val);
                }
              }
            }
          },
          scales: (actualType === 'pie' || actualType === 'doughnut' || actualType === 'polarArea' || actualType === 'radar') ? {} : {
            x: {
              title: { display: !isHorizontal, text: isHorizontal ? config.valueCol : config.labelCol, font: { size: 12 } },
              ticks: { font: { size: 11 }, callback: function(v){ return typeof v === 'number' && Math.abs(v)>=10000 ? (v/10000).toFixed(1)+'万' : v; } },
              grid: { display: false }
            },
            y: {
              title: { display: isHorizontal, text: isHorizontal ? config.labelCol : config.valueCol, font: { size: 12 } },
              ticks: { font: { size: 11 }, callback: function(v){ return typeof v === 'number' && Math.abs(v)>=10000 ? (v/10000).toFixed(1)+'万' : v; } },
              grid: { color: '#f1f5f9' }
            }
          }
        }
      });
    } catch(e) {
      console.error('Chart render error:', e);
    }
  }

    if (!currentTable) { showToast('请先选择左侧表格'); return; }
    var hdrs = headers(currentTable);
    var allRows = rows(currentTable);
    // 检测主键列：有"编号"则用它（自增），否则用第一列
    var hasBianhao = hdrs.indexOf('编号') !== -1;
    var keyCol = hasBianhao ? '编号' : (hdrs.length > 0 ? hdrs[0] : '编号');
    var newId = '';
    if (hasBianhao) {
      var maxNum = 0;
      allRows.forEach(function(r) { var n = parseInt(r['编号'], 10); if (n > maxNum) maxNum = n; });
      newId = String(maxNum + 1);
    }
    document.getElementById('formModalTitle').textContent = '📝 表单新增 - ' + currentTable;
    document.getElementById('formModalInfo').textContent = '表格: ' + currentTable + ' · 已有 ' + allRows.length + ' 条记录';
    var html = '';
    hdrs.forEach(function(hdr) {
      if (hdr.indexOf('填表说明') === 0) {
        html += '<div class="mf-fld" style="margin-top:12px;padding-top:10px;border-top:1px dashed #e5e7eb;">';
        html += '<label style="font-size:11px;color:#9ca3af;font-weight:400;">' + hdr + '</label>';
        html += '<input type="text" disabled>';
        html += '</div>';
        return;
      }
      html += '<div class="mf-fld"><label>' + hdr;
      if (hdr === keyCol) html += ' <span style="color:#ef4444">*</span>';
      html += '</label>';
      var dh = hdr.replace(/"/g, '&quot;');
      var isDate = hdr.indexOf('日期') !== -1 || hdr.indexOf('月份') !== -1;
      var isNum = false;
      if (hdr !== keyCol) {
        var nls = ['数量','金额','单价','小计','成本','定金','尾款','税率','税额','费用','利润','收入','支出','余额','净收入','毛利','折扣率','服务费','开票金额','实收金额','回款金额','总利润','承包费','工资','补助','应得','借支'];
        for (var j = 0; j < nls.length; j++) { if (hdr.indexOf(nls[j]) !== -1) { isNum = true; break; } }
      }
      var isTxt = hdr.indexOf('备注') !== -1 || hdr.indexOf('地址') !== -1 || hdr.indexOf('说明') !== -1 || hdr.indexOf('物流信息') !== -1;
      if (hdr === keyCol && hasBianhao) {
        html += '<input type="text" data-mfh="' + dh + '" value="' + newId + '" required>';
      } else if (hdr === keyCol && !hasBianhao) {
        html += '<input type="text" data-mfh="' + dh + '" required>';
      } else if (isDate) {
        html += '<input type="date" data-mfh="' + dh + '">';
      } else if (isNum) {
        html += '<input type="number" step="0.01" data-mfh="' + dh + '">';
      } else if (isTxt) {
        html += '<textarea data-mfh="' + dh + '" rows="3"></textarea>';
      } else {
        html += '<input type="text" data-mfh="' + dh + '">';
      }
      html += '</div>';
    });
    document.getElementById('formModalBody').innerHTML = html;
    document.getElementById('formModalStatus').className = 'mf-status';
    document.getElementById('formAddModal').style.display = 'flex';
    document.body.style.overflow = 'hidden';
  }
  function closeFormModal() {
    document.getElementById('formAddModal').style.display = 'none';
    document.body.style.overflow = '';
    document.getElementById('formModalStatus').className = 'mf-status';
  }

    function submitFormModal() {
    var btn = document.getElementById('formModalSubmitBtn');
    btn.disabled = true;
    var inputs = document.querySelectorAll('#formModalBody input:not([disabled]), #formModalBody textarea:not([disabled])');
    var record = {};
    inputs.forEach(function(inp) {
      var hdr = inp.getAttribute('data-mfh');
      if (hdr !== null) record[hdr] = inp.value.trim();
    });
    var hdrs = headers(currentTable);
    var hasBianhao = hdrs.indexOf('编号') !== -1;
    var keyCol = hasBianhao ? '编号' : (hdrs.length > 0 ? hdrs[0] : '编号');
    var id = record[keyCol];
    if (!id) { formModalStat(keyCol + '不能为空', 'err'); btn.disabled = false; return; }
    var allRows = rows(currentTable);
    for (var i = 0; i < allRows.length; i++) {
      if (String(allRows[i][keyCol] || '').trim() === id) {
        formModalStat(keyCol + ' "' + id + '" 已存在', 'err'); btn.disabled = false; return;
      }
    }
    allRows.push(record);
    saveData(); renderTable();
    formModalStat('✅ 录入成功 · ' + keyCol + ': ' + id, 'ok');
    showToast('已新增: ' + id);
    formModalStat('⏳ 同步到服务器...', 'loading');
    fetch('/api/tables/' + encodeURIComponent(currentTable) + '/sync', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ rows: allRows })
    }).then(function(r) { return r.json(); })
      .then(function(result) {
        if (result.success) formModalStat('✅ 录入成功 · ' + keyCol + ': ' + id + ' · 已同步', 'ok');
      })
      .catch(function() {
        formModalStat('⚠ 网络异常，已存本地', 'err');
      })
      .finally(function() {
        setTimeout(function() { closeFormModal(); }, 1300);
        btn.disabled = false;
      });
  }

  function formModalStat(msg, type) {
    var el = document.getElementById('formModalStatus');
    var txt = document.getElementById('formModalStatusTxt');
    el.className = 'mf-status show ' + (type || 'ok');
    txt.textContent = msg;
  }

  // FormModal 关闭方式
  document.getElementById('formAddModal').addEventListener('click', function(e) {
    if (e.target === this) closeFormModal();
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      if (document.getElementById('formAddModal').style.display === 'flex') closeFormModal();
      if (document.getElementById('uploadModal').style.display === 'flex') closeUploadModal();
    }
  });

  // ===== 文件上传弹窗 =====
  var _uploadFile = null;
  var _previewRows = null;
  var _previewHeaders = null;

  function openUploadModal() {
    if (!currentTable) { showToast('请先选择左侧表格'); return; }
    document.getElementById('uploadModalInfo').textContent = '当前表格: ' + currentTable + ' · 上传后数据将追加到已有记录中';
    document.getElementById('uploadModal').style.display = 'flex';
    document.body.style.overflow = 'hidden';
    clearUploadFile();
    uploadSetStatus('');
  }

  function closeUploadModal() {
    document.getElementById('uploadModal').style.display = 'none';
    document.body.style.overflow = '';
    clearUploadFile();
  }

  function uploadFileSelected(input) {
    var file = input.files[0];
    if (!file) return;
    if (!file.name.match(/\.xlsx?$/i)) { uploadSetStatus('请选择 .xlsx 或 .xls 文件', 'err'); return; }
    _uploadFile = file;
    _previewRows = null;
    _previewHeaders = null;
    document.getElementById('uploadFileName').textContent = file.name;
    document.getElementById('uploadFileSize').textContent = formatFileSize(file.size);
    document.getElementById('uploadFileBadge').style.display = 'flex';
    document.getElementById('uploadSubmitBtn').disabled = false;
    uploadSetStatus('正在解析文件...', 'loading');
    var reader = new FileReader();
    reader.onload = function(e) {
      try {
        var data = new Uint8Array(e.target.result);
        var workbook = XLSX.read(data, {type: 'array'});
        var sheetName = workbook.SheetNames[0];
        var sheet = workbook.Sheets[sheetName];
        if (!sheet) { uploadSetStatus('无法读取工作表', 'err'); return; }
        var json = XLSX.utils.sheet_to_json(sheet, {header: 1, defval: ''});
        if (!json || json.length < 2) { uploadSetStatus('文件内容不足（需要至少1行表头+1行数据）', 'err'); return; }
        var headers = json[0];
        var rowData = json.slice(1).filter(function(r) {
          return r.some(function(c) { return String(c).trim() !== ''; });
        });
        _previewRows = rowData;
        _previewHeaders = headers;
        var thead = document.getElementById('uploadPreviewHead');
        var tbody = document.getElementById('uploadPreviewBody');
        thead.innerHTML = '<tr>' + headers.map(function(h) { return '<th>' + escHtml(String(h)) + '</th>'; }).join('') + '</tr>';
        var maxShow = Math.min(rowData.length, 50);
        tbody.innerHTML = rowData.slice(0, maxShow).map(function(r) {
          return '<tr>' + r.map(function(c) { return '<td>' + escHtml(String(c)) + '</td>'; }).join('') + '</tr>';
        }).join('');
        if (rowData.length > maxShow) {
          tbody.innerHTML += '<tr><td colspan="' + headers.length + '" style="text-align:center;color:#9ca3af;padding:8px">... 还有 ' + (rowData.length - maxShow) + ' 行未显示</td></tr>';
        }
        document.getElementById('uploadPreviewCount').textContent = '共 ' + rowData.length + ' 条 · ' + headers.length + ' 列';
        document.getElementById('uploadPreviewSection').style.display = 'block';
        uploadSetStatus('已解析 ' + rowData.length + ' 条记录，点击"导入数据"确认上传', 'ok');
      } catch(err) {
        uploadSetStatus('文件解析失败: ' + err.message, 'err');
      }
    };
    reader.readAsArrayBuffer(file);
  }

  function clearUploadFile() {
    _uploadFile = null;
    _previewRows = null;
    _previewHeaders = null;
    var fi = document.getElementById('uploadFileInput');
    if (fi) fi.value = '';
    document.getElementById('uploadFileBadge').style.display = 'none';
    document.getElementById('uploadPreviewSection').style.display = 'none';
    document.getElementById('uploadSubmitBtn').disabled = true;
  }

  function submitUpload() {
    if (!_previewRows || !_previewRows.length) { uploadSetStatus('没有可导入的数据，请先选择文件', 'err'); return; }
    var btn = document.getElementById('uploadSubmitBtn');
    btn.disabled = true;
    uploadSetStatus('正在上传并导入...', 'loading');
    // 将数组行转换为对象格式（用表头作为key）
    var headers = _previewHeaders;
    var rows = _previewRows.map(function(row) {
      var obj = {};
      headers.forEach(function(h, i) { obj[h] = row[i] !== undefined ? row[i] : ''; });
      return obj;
    });
    fetch('/api/tables/' + encodeURIComponent(currentTable) + '/import', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ rows: rows })
    })
    .then(function(r) { return r.json(); })
    .then(function(res) {
      if (res.success || res.inserted !== undefined) {
        var inserted = res.inserted || 0;
        var skipped = res.skipped || 0;
        var msg = '✅ 成功导入 ' + inserted + ' 条记录';
        if (skipped > 0) msg += ' · 跳过 ' + skipped + ' 条重复';
        uploadSetStatus(msg, 'ok');
        showToast('导入成功: ' + inserted + ' 条');
        // 重新加载数据
        fetch('/api/tables/' + encodeURIComponent(currentTable))
          .then(function(r) { return r.json(); })
          .then(function(data) {
            if (data && data.rows) {
              ALL_DATA[currentTable].rows = data.rows;
              ALL_DATA[currentTable].headers = data.headers || [];
              ALL_DATA[currentTable].row_count = data.rows.length;
              saveData(); renderTable();
            }
            setTimeout(function() { closeUploadModal(); }, 1500);
          })
          .catch(function() { renderTable(); setTimeout(function() { closeUploadModal(); }, 1500); });
      } else {
        uploadSetStatus('导入失败: ' + (res.error || '未知错误'), 'err');
        btn.disabled = false;
      }
    })
    .catch(function(err) {
      uploadSetStatus('网络错误: ' + err.message, 'err');
      btn.disabled = false;
    });
  }

  function uploadSetStatus(msg, type) {
    var el = document.getElementById('uploadStatus');
    var txt = document.getElementById('uploadStatusTxt');
    if (!msg) { el.className = 'mf-status'; return; }
    el.className = 'mf-status show ' + (type || 'ok');
    txt.textContent = msg;
  }

  function formatFileSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / 1048576).toFixed(2) + ' MB';
  }

  function escHtml(str) {
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // UploadModal 点遮罩关闭
  document.getElementById('uploadModal').addEventListener('click', function(e) {
    if (e.target === this) closeUploadModal();
  });

  // 拖拽上传
  (function() {
    var dz = document.getElementById('uploadDropzone');
    if (!dz) return;
    dz.addEventListener('dragover', function(e) { e.preventDefault(); e.stopPropagation(); this.classList.add('drag-over'); });
    dz.addEventListener('dragleave', function(e) { e.preventDefault(); e.stopPropagation(); this.classList.remove('drag-over'); });
    dz.addEventListener('drop', function(e) {
      e.preventDefault(); e.stopPropagation();
      this.classList.remove('drag-over');
      var files = e.dataTransfer.files;
      if (files.length > 0) {
        document.getElementById('uploadFileInput').files = files;
        uploadFileSelected(document.getElementById('uploadFileInput'));
      }
    });
  })();

  // Init
    // ===== 多浏览器同步：每5秒自动拉取最新数据 =====
  setInterval(function(){
    if (!document.hidden && currentTable) pullFromServer();
  }, 5000);

  loadData();
  renderSidebar();
  // Check URL params: ?table=XXX to auto-load a specific table
  var urlParams = new URLSearchParams(window.location.search);
  var tableFromUrl = urlParams.get('table');
  if (tableFromUrl && ALL_DATA[tableFromUrl]) {
    switchToTable(tableFromUrl);
  } else {
    switchToTable('销售表');
  }
  // 导出全局函数供 onclick 使用
  window.closeFormModal = closeFormModal;
  window.submitFormModal = submitFormModal;
  window.closeUploadModal = closeUploadModal;
  window.submitUpload = submitUpload;
  window.clearUploadFile = clearUploadFile;
  window.uploadFileSelected = uploadFileSelected;
  window.updateChartConfig = updateChartConfig;
  window.removeChartConfig = removeChartConfig;
})();
</script>

<script>
  // ===== 数据导出/导入 =====
  function exportAllData() {
    var exportObj = {};
    for (var name in ALL_DATA) {
      if (ALL_DATA[name]) {
        exportObj[name] = { headers: ALL_DATA[name].headers, rows: ALL_DATA[name].rows };
      }
    }
    var blob = new Blob([JSON.stringify(exportObj, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'buyuan_data_backup_' + new Date().toISOString().slice(0,10) + '.json';
    a.click();
    URL.revokeObjectURL(url);
    showToast('数据已导出');
  }

  function importAllData(input) {
    var file = input.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(e) {
      try {
        var imported = JSON.parse(e.target.result);
        var count = 0;
        for (var name in imported) {
          if (ALL_DATA[name] && imported[name]) {
            ALL_DATA[name].rows = imported[name].rows || [];
            ALL_DATA[name].row_count = ALL_DATA[name].rows.length;
            count += ALL_DATA[name].row_count;
          }
        }
        saveData();
        pushAllTables();
        if (currentTable) switchToTable(currentTable);
        renderSidebar();
        showToast('已导入 ' + count + ' 条数据');
      } catch(err) {
        showError('导入失败：文件格式错误');
      }
    };
    reader.readAsText(file);
    input.value = '';
  }

</script>
